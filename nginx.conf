# 단일 도메인 구성: 브라우저는 이 nginx 하나만 바라본다.
#   /        → React 정적 파일
#   /api/    → Spring 백엔드 (8081)   ※ 백엔드 컨트롤러가 이미 /api/... 이므로 경로 그대로 전달
#   /ai/     → FastAPI AI 서버 (5000) ※ 접두어 /ai 는 제거되어 전달
#   /static/ → AI 서버 정적 파일
#   /data/   → 백엔드가 생성한 홍보물 (공유 볼륨)
# 업스트림 호스트명은 요청 시점에 해석한다 (AI 서버 기동이 느려도 nginx 가 먼저 죽지 않도록).
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    set $backend_upstream http://${BACKEND_HOST}:${BACKEND_PORT};
    set $ai_upstream      http://${AI_HOST}:${AI_PORT};

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /ai/ {
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /static/ {
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
    }

    location /data/ {
        alias /srv/public/data/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
