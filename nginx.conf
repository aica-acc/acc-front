# 단일 도메인 구성: 브라우저는 이 nginx 하나만 바라본다.
#   /        → React 정적 파일
#   /api/    → Spring 백엔드 (8081)   ※ 백엔드 컨트롤러가 이미 /api/... 이므로 경로 그대로 전달
#   /files/  → Spring 백엔드 → 생성 이미지 (주소는 암호화 토큰. 회원번호·프로젝트 번호·서버 경로가 드러나지 않음)
#   예전 /static/, /data/ 는 막았다 (주소 추측으로 남의 파일을 열 수 있었음)
# 백엔드가 모든 데이터의 중심이다. AI 서버는 백엔드만 호출하며 nginx 는 AI 서버를 알지 못한다.
# 업스트림 호스트명은 요청 시점에 해석한다 (백엔드 기동이 느려도 nginx 가 먼저 죽지 않도록).
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    server_tokens off;   # 응답 헤더에 nginx 버전을 싣지 않는다

    # 글자 파일(JS·CSS·JSON 등)은 압축해서 보낸다 (JS 번들 약 1.9MB → 약 0.5MB). 이미지·영상은 이미 압축 형식이라 제외
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    set $backend_upstream http://${BACKEND_HOST}:${BACKEND_PORT};

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 예전 공개 경로: 화면(index.html)으로 넘기지 않고 없는 주소로 응답
    location ~ ^/(data|static|poster-images)/ {
        return 404;
    }

    location /files/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # 빌드 파일은 이름에 해시가 붙어 내용이 바뀌면 이름도 바뀐다 → 오래 캐시해도 안전
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 은 매번 서버에 확인한다 (배포 후에도 브라우저가 옛 화면을 쓰지 않도록)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
