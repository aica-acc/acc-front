# 단일 도메인 구성: 브라우저는 이 nginx 하나만 바라본다.
#   /        → React 정적 파일
#   /api/    → Spring 백엔드 (8081)   ※ 백엔드 컨트롤러가 이미 /api/... 이므로 경로 그대로 전달
#   /static/ → Spring 백엔드 → AI 서버 정적 파일 (백엔드가 중계)
#   /data/   → 백엔드가 생성한 홍보물 (공유 볼륨)
# 백엔드가 모든 데이터의 중심이다. AI 서버는 백엔드만 호출하며 nginx 는 AI 서버를 알지 못한다.
# 업스트림 호스트명은 요청 시점에 해석한다 (백엔드 기동이 느려도 nginx 가 먼저 죽지 않도록).
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    set $backend_upstream http://${BACKEND_HOST}:${BACKEND_PORT};

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /static/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location /data/ {
        alias /srv/public/data/;
    }

    # 빌드 파일은 이름에 해시가 붙어 내용이 바뀌면 이름도 바뀐다 → 오래 캐시해도 안전
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 은 매번 서버에 확인한다 (배포 후에도 브라우저가 옛 화면을 쓰지 않도록)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
